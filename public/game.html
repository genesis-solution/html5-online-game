<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-Paper-Scissors Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      text-align: center;
      margin: 40px;
    }

    .result {
      font-size: 18px;
      margin-top: 20px;
      color: #333;
    }

    .choice {
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }

    .choice:hover {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mt-5 mb-4">Rock-Paper-Scissors Game</h1>
    <button id="logoutBtn">Logout</button>
  
    <div class="row">
      <div class="col-md-6">
        <h2 id="username">You</h2>
        <div id="yourChoice">
          <button class="btn btn-primary choice" onclick="makeChoice('rock')">Rock</button>
          <button class="btn btn-primary choice" onclick="makeChoice('paper')">Paper</button>
          <button class="btn btn-primary choice" onclick="makeChoice('scissors')">Scissors</button>
        </div>
      </div>
      <div class="col-md-6">
        <h2>Computer</h2>
        <div id="computerChoice">
          <p>Waiting for computer...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="result" id="result"></div>

  <div id="replaySection" style="display: none;">
    <button class="btn btn-primary" onclick="replay()">Re-play</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script>
    const socket = io();

    $.get('/user/info', function(data) {
      $('#username').text('' + data.username + '!');
    });

    // Handle logout button click
    $('#logoutBtn').click(function() {
      // Send a request to the server to logout
      $.post('/logout', function() {
        // Redirect to the login page after successful logout
        window.location.href = '/';
      });
    });

    function makeChoice(choice) {
      socket.emit('user choice', choice);
      $('#yourChoice').empty().html(`<p>Your choice: ${choice}</p>`);
    }

    socket.on('game result', function (data) {
      $('#computerChoice').empty().html(`<p>Computer's choice: ${data.computerChoice}</p>`);
      $('#result').text(`Result: ${data.result}`);
      $('#replaySection').show();
    });

    function replay() {
      $('#yourChoice').empty().html(`
        <button class="btn btn-primary choice" onclick="makeChoice('rock')">Rock</button>
        <button class="btn btn-primary choice" onclick="makeChoice('paper')">Paper</button>
        <button class="btn btn-primary choice" onclick="makeChoice('scissors')">Scissors</button>
      `);
      $('#computerChoice').empty().html('<p>Waiting for computer...</p>');
      $('#result').text('');
      $('#replaySection').hide();
    }
  </script>
</body>
</html>
